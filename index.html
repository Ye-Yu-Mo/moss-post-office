   pine ink, raspberry wax, butter-yellow stamps, and a little lavender dusk.
   Type: ZCOOL KuaiLe for the hand-painted shop signs, Noto Sans SC for the
   postal ledger, Baloo 2 for plump figures and stamps.

   ledger-like shop with three labelled drawers on the right.
------------------------------------------------------------------- */

  color-scheme: light;

  --bg: #e3efe4;

  --paper-2: #f7efdf;

  --scene-line: #45583f;

  --dusk-sky-1: #35555f;

  --dusk-sky-3: #d3a58c;
  --dusk-sky-4: #f7d098;
  --dusk-star: #ffe9ae;

  --dusk-cloud-shadow: #d6a999;
  --dusk-hill-far: #607d63;
  --dusk-hill-mid: #416a4e;
  --dusk-hill-near: #2f543b;

  --toast-bg: #2d4133;
  --toast-ink: #fff8e9;
  --night-bg: #253a39;
  --night-bg-2: #17272f;
  --night-ink: #fff2ce;

  --font-display: "ZCOOL KuaiLe", "Noto Sans SC", "PingFang SC", sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-data: "Baloo 2", "Noto Sans SC", "PingFang SC", sans-serif;
}

    --night-bg-2: #101c24;

  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  min-height: 100%;
}

body {
  min-height: 100%;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 12% 4%, rgba(242, 200, 109, 0.16), transparent 27rem),
    radial-gradient(circle at 92% 18%, rgba(159, 150, 199, 0.12), transparent 25rem),
    radial-gradient(circle at 1px 1px, var(--bg-dot) 1px, transparent 1.4px);
  background-size: auto, auto, 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

p,
h1,
h2,
h3 {
  margin-top: 0;
}

.page {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding-block: clamp(20px, 3.2vw, 36px) 22px;
}

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

/* AI-painted icon sprite: 4 columns x 6 rows */
.s-icon {
  display: inline-block;
  flex: 0 0 auto;
  width: 1em;
  height: 1em;
  background-image: url(assets/ui-icons.webp);
  background-repeat: no-repeat;
  background-size: 400% 600%;
  background-position: calc(var(--c) * 33.3333%) calc(var(--r) * 20%);
}

.brand-seal {
  position: relative;
  width: 54px;
  height: 54px;
  flex: 0 0 54px;
  display: grid;
  place-items: center;
  color: var(--wax-ink);
  background:
    radial-gradient(circle at 36% 28%, var(--wax-light), var(--wax) 58%, var(--wax-shadow) 100%);
  border-radius: 50%;
  box-shadow:
    inset 0 0 0 4px rgba(255, 255, 255, 0.14),
    inset 0 -6px 12px rgba(0, 0, 0, 0.14),
    0 5px 0 var(--wax-shadow),
    0 9px 18px var(--shadow);
  transform: rotate(-7deg);
}

.brand-seal::before {
  content: "";
  position: absolute;
  width: 42px;
  height: 42px;
  border: 1px dashed currentColor;
  border-radius: 50%;
  opacity: 0.52;
}

.brand-seal .s-icon {
  width: 30px;
  height: 30px;
  position: relative;
  z-index: 1;
}

.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(27px, 3.1vw, 34px);
  line-height: 1.06;
  letter-spacing: 0.045em;
}

.brand p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11.5px;
  letter-spacing: 0.04em;
}

.topbar-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 9px;
  flex-wrap: wrap;
}

.day-note {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px dashed var(--line-strong);
  border-radius: 999px;
  color: var(--muted);
  background: color-mix(in srgb, var(--paper) 62%, transparent);
  font-size: 11px;
  letter-spacing: 0.035em;
  white-space: normal;
  max-width: 100%;
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--moss);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--moss) 18%, transparent);
  animation: breathe 2.8s ease-in-out infinite;
}

.soft-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 2px 0 var(--soft-shadow);
  transition: transform 150ms ease, background 150ms ease;
}

.soft-btn:hover {
  transform: translateY(-1px);
  background: var(--paper-2);
}

.soft-btn[aria-pressed="false"] {
  color: var(--muted);
}

.soft-btn .s-icon {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

/* ---------- main album ---------- */
.game-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(355px, 0.9fr);
  gap: 20px;
  align-items: start;
}

.stage-card,
.shop-card {
  min-width: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 30px;
  box-shadow:
    0 22px 52px var(--shadow),
    inset 0 1px 0 rgba(255, 255, 255, 0.32);
}

.stage-card {
  display: flex;
  flex-direction: column;
  align-self: start;
  overflow: hidden;
  position: relative;
}

.stage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 20px;
  border-bottom: 1px dashed var(--line);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  line-height: 1.2;
}

.eyebrow::before {
  content: "";
  width: 13px;
  height: 3px;
  border-radius: 2px;
  background: var(--berry);
}

.open-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--moss-deep);
  background: var(--paper-2);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

.open-pill::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--moss);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--moss) 18%, transparent);
}

.scene {
  position: relative;
  flex: 0 0 auto;
  height: clamp(320px, 31vw, 430px);
  min-height: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    linear-gradient(
      180deg,
      var(--dusk-sky-1) 0%,
      var(--dusk-sky-2) 46%,
      var(--dusk-sky-3) 72%,
      var(--dusk-sky-4) 100%
    );
}

.scene-bg {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 55%;
  z-index: 0;
  pointer-events: none;
  user-select: none;
}

.scene-fx {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
}

.scene-fx canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.scene-grain {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background:
    radial-gradient(circle at 66% 62%, rgba(255, 200, 107, 0.07), transparent 24%),
    radial-gradient(ellipse at 52% 43%, transparent 48%, rgba(7, 17, 13, 0.22) 100%),
    linear-gradient(180deg, rgba(18, 32, 30, 0.04), transparent 35%, rgba(8, 17, 13, 0.12));
}

.weather-chip {
  position: absolute;
  z-index: 4;
  top: 13px;
  right: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border: 1px solid color-mix(in srgb, var(--line-strong) 72%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--paper) 78%, transparent);
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  backdrop-filter: blur(4px);
}

.weather-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
}

.weather-icon .s-icon {
  width: 15px;
  height: 15px;
}

/* little critters in the illustration */
.twinkle {
  animation: twinkle 3.4s ease-in-out infinite;
}

.twinkle:nth-of-type(2n) {
  animation-delay: 1.1s;
}

.twinkle:nth-of-type(3n) {
  animation-delay: 2.2s;
}

/* ---------- counter ---------- */
.counter {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 17px 20px 16px;
  background: var(--paper);
  border-top: 1px dashed var(--line);
}

.counter::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 22px;
  width: 48px;
  height: 13px;
  border: 1px solid color-mix(in srgb, var(--butter-deep) 38%, transparent);
  background: color-mix(in srgb, var(--butter) 72%, transparent);
  transform: rotate(-2.5deg);
  opacity: 0.9;
}

.ledger {
  flex: 1 1 auto;
  min-width: 0;
}

.ledger-label {
  display: block;
  margin-bottom: 2px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.amount-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.stamp-mark {
  display: inline-block;
  width: 17px;
  height: 21px;
  flex: 0 0 17px;
  align-self: center;
  border: 1.5px dashed var(--butter-deep);
  border-radius: 2px;
  background:
    linear-gradient(135deg, var(--berry) 0 44%, transparent 45%),
    var(--butter);
  box-shadow: inset 0 0 0 3px var(--paper-2);
  transform: rotate(-5deg);
}

.big-amount {
  display: block;
  min-width: 0;
  color: var(--ink);
  font-family: var(--font-data);
  font-size: clamp(33px, 4.5vw, 49px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 0.92;
  font-variant-numeric: tabular-nums;
}

.amount-unit {
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 500;
  white-space: nowrap;
}

.rate-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 6px;
  margin-top: 7px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.35;
}

.rate-line strong {
  color: var(--moss-deep);
  font-family: var(--font-data);
  font-size: 12.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.rate-sep {
  color: var(--line-strong);
}

.combo-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.025em;
}

.combo-label {
  color: var(--berry);
  font-family: var(--font-data);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.combo-track {
  width: 76px;
  height: 5px;
  flex: 0 1 auto;
  overflow: hidden;
  border-radius: 999px;
  background: var(--paper-3);
}

.combo-fill {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--butter), var(--berry));
  transition: width 120ms linear;
}

.combo-tip {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: clip;
}

.seal-wrap {
  position: relative;
  flex: 0 0 auto;
  padding: 4px;
}

.seal-button {
  position: relative;
  width: 116px;
  height: 116px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border: 0;
  border-radius: 50%;
  color: var(--wax-ink);
  background:
    radial-gradient(circle at 35% 27%, var(--wax-light), var(--wax) 54%, var(--wax-shadow) 100%);
  box-shadow:
    inset 0 0 0 5px rgba(255, 255, 255, 0.12),
    inset 0 -8px 16px rgba(0, 0, 0, 0.16),
    0 8px 0 var(--wax-shadow),
    0 14px 22px var(--shadow);
  transform: rotate(-5deg);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
}

.seal-button::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px dashed color-mix(in srgb, var(--wax-ink) 58%, transparent);
  border-radius: 50%;
  opacity: 0.85;
}

.seal-button::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: 50%;
  box-shadow: inset 0 0 26px rgba(255, 255, 255, 0.08);
  pointer-events: none;
}

.seal-button .s-icon {
  position: relative;
  z-index: 1;
  width: 34px;
  height: 34px;
  margin-bottom: 2px;
}

.seal-title {
  position: relative;
  z-index: 1;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 400;
  letter-spacing: 0.06em;
  line-height: 1.1;
}

.seal-gain {
  position: relative;
  z-index: 1;
  color: var(--wax-ink);
  font-family: var(--font-data);
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.seal-button:hover {
  transform: translateY(-3px) rotate(-2deg);
  filter: saturate(1.04);
}

.seal-button:active {
  transform: translateY(5px) rotate(-6deg) scale(0.975);
  box-shadow:
    inset 0 0 0 5px rgba(255, 255, 255, 0.12),
    inset 0 -4px 10px rgba(0, 0, 0, 0.16),
    0 3px 0 var(--wax-shadow),
    0 6px 10px var(--shadow);
}

.seal-button:focus-visible {
  outline-color: var(--focus);
  outline-offset: 5px;
}

.floaters {
  position: absolute;
  inset: 0;
  z-index: 4;
  overflow: visible;
  pointer-events: none;
}

.floater {
  position: absolute;
  left: 50%;
  top: 22%;
  color: var(--berry);
  font-family: var(--font-data);
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  text-shadow: 0 2px 0 var(--paper), 0 0 8px var(--paper);
  transform: translate(-50%, 0);
  animation: float-up 820ms cubic-bezier(0.16, 0.75, 0.3, 1) forwards;
  pointer-events: none;
}

.spark {
  position: absolute;
  left: 50%;
  top: 48%;
  width: var(--size, 6px);
  height: var(--size, 6px);
  border-radius: 50%;
  background: var(--spark-color, var(--butter));
  transform: translate(-50%, -50%);
  animation: spark-out 620ms ease-out forwards;
  pointer-events: none;
}

.spark.leaf {
  border-radius: 2px 7px 2px 7px;
}

.scene-floater {
  color: var(--butter);
  font-size: 15px;
  text-shadow: 0 2px 0 rgba(28, 48, 33, 0.38), 0 0 10px rgba(28, 48, 33, 0.25);
}

/* ---------- goal strip ---------- */
.goal-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 70px;
  padding: 12px 20px 13px;
  border-top: 1px dashed var(--line);
  background: var(--paper-2);
}

.goal-mark {
  display: grid;
  place-items: center;
  width: 33px;
  height: 38px;
  flex: 0 0 33px;
  border: 1.5px dashed color-mix(in srgb, var(--berry) 55%, var(--line));
  border-radius: 3px;
  background: var(--paper);
  color: var(--berry);
  font-family: var(--font-data);
  font-size: 14px;
  font-weight: 700;
  transform: rotate(-3deg);
}

.goal-body {
  flex: 1 1 auto;
  min-width: 0;
}

.goal-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.goal-count {
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.goal-title {
  margin: 0;
  overflow-wrap: anywhere;
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.35;
}

.goal-bar {
  height: 4px;
  margin-top: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--paper-3);
}

.goal-fill {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: var(--moss);
  transition: width 300ms ease;
}

.goal-strip.is-done .goal-mark {
  color: var(--moss-deep);
  border-color: color-mix(in srgb, var(--moss) 55%, var(--line));
}

.goal-strip.is-done .goal-fill {
  background: var(--moss);
}

/* ---------- shop ---------- */
.shop-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 560px;
}

.shop-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 20px 20px 11px;
}

.shop-head h2 {
  margin: 3px 0 0;
  font-family: var(--font-display);
  font-size: clamp(21px, 2vw, 25px);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: 0.035em;
}

.buy-switch {
  display: inline-flex;
  flex: 0 0 auto;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper-2);
}

.buy-switch button {
  min-width: 35px;
  padding: 4px 7px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1.3;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}

.buy-switch button[aria-pressed="true"] {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 4px var(--soft-shadow);
}

.tabs {
  display: flex;
  gap: 14px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
}

.tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 9px 0 10px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.025em;
  cursor: pointer;
  white-space: nowrap;
}

.tab::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: transparent;
}

.tab:focus-visible {
  outline-offset: -2px;
  border-radius: 5px;
}

.tab[aria-selected="true"] {
  color: var(--ink);
}

.tab[aria-selected="true"]::after {
  background: var(--berry);
}

.tab-count {
  display: inline-grid;
  place-items: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--wax);
  color: var(--wax-ink);
  font-family: var(--font-data);
  font-size: 9.5px;
  font-weight: 700;
  line-height: 1;
}

.panel {
  flex: 1 1 auto;
  min-height: 380px;
  padding: 12px 20px 6px;
}

/* shop rows */
.item,
.upgrade {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--line);
}

.item:last-child,
.upgrade:last-child {
  border-bottom: 0;
}

.item.locked {
  color: var(--muted);
}

.item-icon,
.up-icon {
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background:
    radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--butter) 24%, transparent), transparent 65%),
    var(--paper-2);
}

.item-icon {
  width: 52px;
  height: 52px;
}

.item-icon::after,
.up-icon::after {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px dashed var(--line);
  border-radius: 6px;
  pointer-events: none;
}

.item-icon .s-icon {
  position: relative;
  z-index: 1;
  width: 39px;
  height: 39px;
}

.item.locked .item-icon .s-icon {
  opacity: 0.42;
  filter: grayscale(0.9);
}

.item.locked .item-icon::after {
  opacity: 0.4;
}

.item-copy,
.up-copy {
  min-width: 0;
}

.item-name {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 3px 7px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.3;
}

.item.locked .item-name {
  color: var(--muted);
}

.owned-badge {
  display: inline-block;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--paper-3);
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 9.5px;
  font-weight: 700;
  line-height: 1.6;
  white-space: nowrap;
}

.item-desc {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.45;
}

.item-meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.4;
}

.item-meta b {
  color: var(--moss-deep);
  font-family: var(--font-data);
  font-size: 10.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.item-meta .meta-sep {
  margin: 0 4px;
  color: var(--line-strong);
}

.buy-btn {
  min-width: 68px;
  max-width: 94px;
  padding: 8px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: var(--paper-2);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  cursor: pointer;
  line-height: 1.05;
  transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
}

.buy-btn .cost {
  font-family: var(--font-data);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.buy-btn .unit {
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.buy-btn.can-buy {
  border-color: var(--action);
  background: var(--action);
  color: var(--action-ink);
  box-shadow: 0 3px 0 color-mix(in srgb, var(--action) 62%, var(--ink));
}

.buy-btn.can-buy .unit {
  color: inherit;
  opacity: 0.9;
}

.buy-btn.can-buy:hover {
  transform: translateY(-1px);
}

.buy-btn.can-buy:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 color-mix(in srgb, var(--action) 62%, var(--ink));
}

.buy-btn:disabled {
  cursor: not-allowed;
}

.buy-btn.locked-btn {
  border-style: dashed;
  background: transparent;
  color: var(--muted);
}

.buy-btn.locked-btn .cost {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 500;
}

.item.is-bought .item-icon {
  animation: item-pop 340ms ease-out;
}

/* upgrades */
.up-icon {
  width: 46px;
  height: 46px;
  grid-column: 1;
}

.up-icon .s-icon {
  position: relative;
  z-index: 1;
  width: 33px;
  height: 33px;
}

.upgrade {
  grid-template-columns: 46px minmax(0, 1fr) auto;
  gap: 11px;
  padding: 10px 0;
}

.up-name {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.3;
}

.up-tag {
  display: inline-block;
  padding: 0 5px;
  border: 1px dashed var(--line-strong);
  border-radius: 999px;
  color: var(--moss-deep);
  font-size: 8.5px;
  font-weight: 700;
  white-space: nowrap;
}

.up-desc {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.45;
}

.upgrade.purchased .up-icon {
  opacity: 0.68;
}

.owned-mark {
  padding: 5px 8px;
  border: 1px dashed color-mix(in srgb, var(--moss) 50%, var(--line));
  border-radius: 999px;
  color: var(--moss-deep);
  font-size: 9.5px;
  font-weight: 700;
  white-space: nowrap;
}

.upgrade.locked .up-icon .s-icon {
  opacity: 0.42;
  filter: grayscale(0.9);
}

.empty-state {
  display: grid;
  place-items: center;
  min-height: 280px;
  padding: 32px 20px;
  text-align: center;
  color: var(--muted);
}

.empty-state .s-icon {
  width: 58px;
  height: 58px;
  margin-bottom: 12px;
  opacity: 0.8;
}

.empty-state p {
  max-width: 24em;
  margin-bottom: 0;
  font-size: 11.5px;
  line-height: 1.65;
}

/* ---------- dispatch desk ---------- */
.dispatch-summary {
  position: relative;
  margin-top: 5px;
  padding: 12px 13px;
  overflow: hidden;
  border: 1px dashed var(--line-strong);
  border-radius: 15px;
  background:
    radial-gradient(circle at 92% 8%, color-mix(in srgb, var(--butter) 28%, transparent), transparent 36%),
    var(--paper-2);
}

.dispatch-summary::after {
  content: "";
  position: absolute;
  right: -25px;
  top: -30px;
  width: 105px;
  height: 105px;
  border: 1px dashed var(--line-strong);
  border-radius: 50%;
  opacity: 0.5;
  pointer-events: none;
}

.dispatch-kicker {
  display: block;
  margin-bottom: 2px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.dispatch-free {
  display: block;
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 400;
  line-height: 1.2;
}

.dispatch-summary p {
  margin: 4px 0 0;
  max-width: 27em;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.5;
}

.dispatch-slots {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
}

.slot-pip {
  width: 9px;
  height: 9px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--paper-3);
}

.slot-pip.is-free {
  border-color: var(--moss);
  background: var(--moss);
}

.slot-pip.is-busy {
  border-color: var(--wax);
  background: var(--wax);
}

.dispatch-slot-note {
  margin-left: 3px;
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 9.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.dispatch-ready {
  margin-top: 10px;
  padding: 10px 11px;
  border: 1px solid color-mix(in srgb, var(--butter-deep) 28%, var(--line));
  border-radius: 13px;
  background: color-mix(in srgb, var(--butter) 21%, var(--paper-2));
}

.dispatch-ready-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  color: var(--ink);
  font-size: 10px;
  font-weight: 700;
}

.dispatch-ready-head span:last-child {
  color: var(--muted);
  font-size: 8.5px;
  font-weight: 500;
}

.dispatch-collect-all {
  margin-top: 7px;
  color: var(--moss-deep);
  font-size: 9px;
}

.ready-list {
  display: grid;
  gap: 5px;
  margin-top: 7px;
}

.ready-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.ready-card:hover {
  background: var(--paper-2);
}

.ready-route {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
}

.ready-reward {
  display: block;
  margin-top: 1px;
  color: var(--moss-deep);
  font-family: var(--font-data);
  font-size: 9.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.ready-claim {
  flex: 0 0 auto;
  padding: 4px 7px;
  border-radius: 999px;
  background: var(--action);
  color: var(--action-ink);
  font-size: 9px;
  font-weight: 700;
}

.dispatch-section {
  margin-top: 13px;
}

.dispatch-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.dispatch-section-head span:last-child {
  font-family: var(--font-data);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}

.trip-list {
  display: grid;
  gap: 7px;
}

.trip-card {
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper-2);
}

.trip-head,
.trip-foot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.trip-name {
  color: var(--ink);
  font-size: 10.5px;
  font-weight: 700;
}

.trip-countdown {
  color: var(--berry);
  font-family: var(--font-data);
  font-size: 10.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.trip-bar {
  height: 4px;
  margin: 6px 0 5px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--paper-3);
}

.trip-fill {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--moss), var(--butter));
  transition: width 350ms linear;
}

.trip-foot {
  color: var(--muted);
  font-size: 8.5px;
}

.trip-foot b {
  color: var(--moss-deep);
  font-family: var(--font-data);
  font-size: 9px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.dispatch-empty {
  padding: 11px;
  border: 1px dashed var(--line);
  border-radius: 11px;
  background: var(--paper-2);
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.5;
  text-align: center;
}

.route-list {
  display: grid;
  gap: 0;
}

.route-card {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}

.route-card:last-child {
  border-bottom: 0;
}

.route-art {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
  background:
    radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--butter) 24%, transparent), transparent 64%),
    color-mix(in srgb, var(--route-accent, var(--moss-light)) 25%, var(--paper-2));
}

.route-art .s-icon {
  width: 36px;
  height: 36px;
}

.route-card.locked .route-art .s-icon {
  opacity: 0.36;
  filter: grayscale(0.9);
}

.route-copy {
  min-width: 0;
}

.route-name-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
}

.route-name {
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.25;
}

.route-stars {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.route-star {
  width: 5px;
  height: 5px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--paper-3);
}

.route-star.is-on {
  border-color: var(--butter-deep);
  background: var(--butter);
}

.route-desc {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.4;
}

.route-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px 7px;
  margin-top: 3px;
  color: var(--muted);
  font-size: 8.5px;
  line-height: 1.35;
}

.route-meta b {
  color: var(--moss-deep);
  font-family: var(--font-data);
  font-size: 9.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.route-card.locked .route-name {
  color: var(--muted);
}

.route-btn {
  min-width: 59px;
  max-width: 76px;
  min-height: 34px;
  padding: 7px 8px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--paper-2);
  color: var(--ink);
  font-size: 9.5px;
  font-weight: 700;
  line-height: 1.2;
  cursor: pointer;
}

.route-btn.can-go {
  border-color: var(--action);
  background: var(--action);
  color: var(--action-ink);
  box-shadow: 0 2px 0 color-mix(in srgb, var(--action) 62%, var(--ink));
}

.route-btn.can-go:hover {
  transform: translateY(-1px);
}

.route-btn:disabled {
  cursor: not-allowed;
  color: var(--muted);
}

.route-btn:disabled.can-go {
  color: var(--action-ink);
}

@media (max-width: 620px) {
  .route-card {
    grid-template-columns: 42px minmax(0, 1fr) auto;
    gap: 8px;
  }

  .route-art {
    width: 42px;
    height: 42px;
  }

  .route-art .s-icon {
    width: 30px;
    height: 30px;
  }

  .route-btn {
    min-height: 40px;
  }
}

/* prestige drawer */
.moon-card {
  position: relative;
  min-height: 142px;
  margin-top: 5px;
  overflow: hidden;
  border-radius: 18px;
  background:
    radial-gradient(circle at 76% 26%, rgba(255, 236, 184, 0.16), transparent 24%),
    linear-gradient(145deg, var(--night-bg), var(--night-bg-2));
  color: var(--night-ink);
}

.moon-card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 58%;
}

.moon-caption {
  position: absolute;
  left: 16px;
  top: 12px;
  margin: 0;
  color: var(--night-ink);
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.05em;
  text-shadow: 0 1px 7px rgba(8, 16, 16, 0.45);
}

.moon-stars {
  animation: twinkle 3.8s ease-in-out infinite;
}

.prestige-copy {
  margin: 14px 0 12px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}

.prestige-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-bottom: 12px;
}

.prestige-stat {
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper-2);
}

.prestige-stat span {
  display: block;
  color: var(--muted);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.04em;
}

.prestige-stat strong {
  display: block;
  margin-top: 1px;
  color: var(--ink);
  font-family: var(--font-data);
  font-size: 17px;
  font-weight: 700;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.prestige-progress {
  margin-bottom: 12px;
}

.prestige-progress-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.4;
}

.prestige-progress-top b {
  color: var(--ink);
  font-family: var(--font-data);
  font-size: 10.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.prestige-bar {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--paper-3);
}

.prestige-fill {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--lavender), var(--butter));
  transition: width 400ms ease;
}

.primary-btn {
  width: 100%;
  min-height: 41px;
  padding: 9px 14px;
  border: 1px solid var(--action);
  border-radius: 13px;
  background: var(--action);
  color: var(--action-ink);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--action) 60%, var(--ink));
  transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
}

.primary-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.primary-btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 1px 0 color-mix(in srgb, var(--action) 60%, var(--ink));
}

.primary-btn:disabled {
  border-color: var(--line-strong);
  background: var(--paper-2);
  color: var(--muted);
  box-shadow: none;
  cursor: not-allowed;
}

.prestige-note {
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.55;
  text-align: center;
}

.shop-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 20px 13px;
  border-top: 1px dashed var(--line);
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.35;
}

.link-btn {
  padding: 0;
  border: 0;
  border-bottom: 1px dashed var(--line-strong);
  background: transparent;
  color: var(--muted);
  font-size: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.link-btn:hover {
  color: var(--ink);
}

/* ---------- gift letter ---------- */
.golden-letter {
  position: absolute;
  z-index: 5;
  width: 76px;
  height: 58px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  filter: drop-shadow(0 7px 8px rgba(39, 55, 43, 0.22));
  transform: rotate(var(--tilt, -4deg));
  animation: golden-float 2.4s ease-in-out infinite;
}

.golden-letter:hover {
  filter: drop-shadow(0 8px 11px rgba(39, 55, 43, 0.28)) brightness(1.04);
}

.golden-letter .s-icon {
  position: relative;
  z-index: 1;
  display: block;
  width: 58px;
  height: 58px;
  margin: 0 auto;
}

.golden-tag {
  position: absolute;
  left: 50%;
  bottom: -17px;
  transform: translateX(-50%);
  padding: 1px 6px;
  border: 1px solid color-mix(in srgb, var(--butter-deep) 50%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  color: var(--ink);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.04em;
  white-space: nowrap;
  backdrop-filter: blur(3px);
}

.golden-rays {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px dashed color-mix(in srgb, var(--butter) 82%, transparent);
  opacity: 0.7;
  animation: rays 7s linear infinite;
}

.scene-sparks {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  overflow: hidden;
}


/* ---------- weather, bell, milestones, album ---------- */
.scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  transition: opacity 800ms ease;
}

.scene[data-weather="sunny"]::before {
  opacity: 1;
  background: radial-gradient(circle at 78% 16%, rgba(255, 239, 177, 0.24), transparent 37%);
}

.scene[data-weather="windy"]::before {
  opacity: 1;
  background: linear-gradient(105deg, rgba(255, 221, 171, 0.08), transparent 46%, rgba(245, 197, 148, 0.12));
}

.scene[data-weather="rainy"]::before {
  opacity: 1;
  background:
    linear-gradient(180deg, rgba(34, 66, 74, 0.16), rgba(22, 44, 42, 0.34)),
    radial-gradient(ellipse at 50% 12%, transparent 30%, rgba(17, 37, 36, 0.18) 100%);
}

.scene[data-weather="misty"]::before {
  opacity: 1;
  background:
    linear-gradient(180deg, rgba(238, 242, 226, 0.24), transparent 54%, rgba(226, 237, 225, 0.13));
}

.bell-btn {
  --bell-progress: 100;
  position: relative;
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: conic-gradient(
    var(--butter) calc(var(--bell-progress) * 1%),
    var(--paper-3) 0
  );
  cursor: pointer;
  box-shadow: 0 2px 0 var(--soft-shadow);
  transition: transform 150ms ease, box-shadow 150ms ease;
}

.bell-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
}

.bell-inner .s-icon {
  width: 20px;
  height: 20px;
  transform-origin: 50% 12%;
}

.bell-label {
  margin-top: 1px;
  font-size: 9.5px;
  font-weight: 700;
  line-height: 1.1;
  white-space: nowrap;
}

.bell-sub {
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 8px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.bell-btn.is-ready .bell-inner .s-icon {
  animation: bell-sway 4.5s ease-in-out infinite;
}

.bell-btn.is-active {
  box-shadow:
    0 0 0 3px color-mix(in srgb, var(--butter) 32%, transparent),
    0 0 24px color-mix(in srgb, var(--butter) 34%, transparent),
    0 2px 0 var(--soft-shadow);
}

.bell-btn.is-active .bell-inner {
  border-color: color-mix(in srgb, var(--butter-deep) 58%, var(--line));
  background: color-mix(in srgb, var(--butter) 22%, var(--paper));
}

.bell-btn.is-cooling .bell-inner .s-icon {
  opacity: 0.55;
}

.bell-btn.is-ringing .bell-inner .s-icon {
  animation: bell-sway 220ms ease-in-out 3;
}

.bell-btn:hover {
  transform: translateY(-1px);
}

.bell-btn:active {
  transform: translateY(1px);
}

.stage-card.is-belled {
  box-shadow:
    0 22px 52px var(--shadow),
    0 0 0 2px color-mix(in srgb, var(--butter) 42%, transparent),
    0 0 52px color-mix(in srgb, var(--butter) 20%, transparent);
}

.item-mile {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 3px;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.35;
}

.item-mile::before {
  content: "";
  width: 5px;
  height: 5px;
  flex: 0 0 5px;
  border-radius: 50%;
  background: var(--butter);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--butter) 18%, transparent);
}

.item-mile strong {
  color: var(--moss-deep);
  font-family: var(--font-data);
  font-size: 9.5px;
  font-weight: 700;
  white-space: nowrap;
}

.boost-badge {
  display: inline-block;
  padding: 0 5px;
  border: 1px dashed color-mix(in srgb, var(--butter-deep) 50%, var(--line));
  border-radius: 999px;
  background: color-mix(in srgb, var(--butter) 22%, transparent);
  color: var(--ink);
  font-size: 8.5px;
  font-weight: 700;
  line-height: 1.55;
  white-space: nowrap;
}

.album-summary {
  margin: 5px 0 12px;
  padding: 11px 12px;
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  background: var(--paper-2);
}

.album-summary-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
}

.album-summary-title {
  font-size: 11px;
  font-weight: 700;
}

.album-summary-bonus {
  color: var(--moss-deep);
  font-family: var(--font-data);
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.album-summary p {
  margin: 0;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.5;
}

.album-bar {
  height: 4px;
  margin-top: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--paper-3);
}

.album-fill {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--moss), var(--butter));
  transition: width 300ms ease;
}

.album-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.album-stamp {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 110px;
  padding: 9px 8px 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper-2);
}

.album-stamp::after {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px dashed var(--line);
  border-radius: 4px;
  pointer-events: none;
}

.album-stamp.collected {
  border-color: color-mix(in srgb, var(--moss) 45%, var(--line));
  background:
    radial-gradient(circle at 86% 8%, color-mix(in srgb, var(--butter) 30%, transparent), transparent 46%),
    var(--paper-2);
}

.album-stamp-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 5px;
  margin-bottom: 4px;
}

.album-art {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  border-radius: 7px;
  background: var(--paper);
  border: 1px solid var(--line);
}

.album-art .s-icon {
  width: 26px;
  height: 26px;
}

.album-stamp:not(.collected) .album-art {
  filter: grayscale(0.92);
  opacity: 0.45;
}

.album-reward {
  position: relative;
  z-index: 1;
  color: var(--moss-deep);
  font-family: var(--font-data);
  font-size: 9px;
  font-weight: 700;
  white-space: nowrap;
}

.album-name {
  position: relative;
  z-index: 1;
  color: var(--ink);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.album-stamp:not(.collected) .album-name {
  color: var(--muted);
}

.album-desc {
  position: relative;
  z-index: 1;
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.4;
}

.album-progress {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: auto;
  padding-top: 5px;
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 8.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.album-mini-bar {
  flex: 1 1 auto;
  height: 3px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--paper-3);
}

.album-mini-fill {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: var(--moss);
}

.album-stamp.collected .album-progress {
  color: var(--moss-deep);
  font-family: var(--font-body);
  font-size: 8.5px;
  font-weight: 700;
}

/* ---------- mobile quick dock ---------- */
.mobile-dock {
  display: none;
}

@media (max-width: 720px) {
  .page {
    padding-bottom: calc(24px + 84px + env(safe-area-inset-bottom, 0px));
  }

  .mobile-dock {
    position: fixed;
    z-index: 40;
    left: 0;
    right: 0;
    bottom: 0;
    display: block;
    padding:
      8px
      max(16px, env(safe-area-inset-right, 0px))
      calc(8px + env(safe-area-inset-bottom, 0px))
      max(16px, env(safe-area-inset-left, 0px));
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--paper) 91%, transparent);
    box-shadow: 0 -12px 35px var(--shadow);
    backdrop-filter: blur(14px);
    visibility: hidden;
    pointer-events: none;
    transform: translateY(calc(100% + 14px));
    transition: transform 240ms ease, visibility 0s linear 240ms;
    will-change: transform;
  }

  .mobile-dock.is-visible {
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
    transition: transform 240ms ease;
  }

  .mobile-dock-inner {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  .quick-stats {
    flex: 1 1 auto;
    min-width: 0;
    line-height: 1.05;
  }

  .quick-label {
    display: block;
    color: var(--muted);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .quick-stats strong {
    display: inline-block;
    margin-top: 2px;
    max-width: 100%;
    color: var(--ink);
    font-family: var(--font-data);
    font-size: 21px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .quick-stats > span:last-child {
    display: inline-block;
    margin-left: 4px;
    color: var(--moss-deep);
    font-family: var(--font-data);
    font-size: 10px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .quick-shop {
    display: flex;
    flex: 0 0 46px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    width: 46px;
    height: 46px;
    border: 1px dashed var(--line-strong);
    border-radius: 13px;
    background: var(--paper-2);
    color: var(--ink);
    font-size: 8.5px;
    font-weight: 700;
    cursor: pointer;
  }

  .quick-shop .s-icon {
    width: 22px;
    height: 22px;
  }

  .quick-seal {
    display: flex;
    flex: 0 0 56px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 27%, var(--wax-light), var(--wax) 57%, var(--wax-shadow) 100%);
    color: var(--wax-ink);
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.05em;
    line-height: 1.1;
    box-shadow:
      inset 0 0 0 3px rgba(255, 255, 255, 0.12),
      0 3px 0 var(--wax-shadow);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }

  .quick-seal b {
    font-family: var(--font-data);
    font-size: 9.5px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .quick-seal:active {
    transform: translateY(2px);
    box-shadow:
      inset 0 0 0 3px rgba(255, 255, 255, 0.12),
      0 1px 0 var(--wax-shadow);
  }

  .toast {
    bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  }

  .mobile-dock.is-visible ~ .toast {
    bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
}

/* ---------- footer, toast, modal ---------- */
.page-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 15px 4px 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
}

.page-foot p {
  display: flex;
  flex: 1 1 300px;
  flex-wrap: wrap;
  align-items: center;
  min-width: 0;
  gap: 7px;
  margin: 0;
}

.foot-dot {
  width: 5px;
  height: 5px;
  flex: 0 0 5px;
  border-radius: 50%;
  background: var(--moss);
}

.foot-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 13px;
}

.toast {
  position: fixed;
  z-index: 55;
  left: 50%;
  bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 14px));
  max-width: min(92vw, 440px);
  padding: 10px 15px;
  border-radius: 13px;
  background: var(--toast-bg);
  color: var(--toast-ink);
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.22);
  font-size: 11.5px;
  line-height: 1.55;
  text-align: center;
  transform: translateX(-50%);
  animation: toast-in 280ms ease-out;
}

.modal-backdrop {
  position: fixed;
  z-index: 60;
  inset: 0;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  background: var(--overlay);
  backdrop-filter: blur(5px);
}

.modal-card {
  width: min(460px, 100%);
  max-height: min(86vh, 680px);
  overflow-y: auto;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: var(--paper);
  box-shadow: 0 28px 80px rgba(16, 25, 19, 0.30);
  animation: modal-in 220ms ease-out;
}

.modal-card:focus {
  outline: none;
}

.modal-kicker {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.modal-kicker::before {
  content: "";
  width: 13px;
  height: 3px;
  border-radius: 2px;
  background: var(--berry);
}

.modal-card h3 {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: 0.03em;
}

.modal-body {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.modal-body p {
  margin-bottom: 10px;
}

.modal-body p:last-child {
  margin-bottom: 0;
}

.modal-body b {
  color: var(--ink);
  font-weight: 700;
}

.modal-list {
  display: grid;
  gap: 9px;
  margin: 13px 0 0;
  padding: 0;
  list-style: none;
}

.modal-list li {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.55;
}

.modal-list b {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border: 1px dashed var(--line-strong);
  border-radius: 50%;
  color: var(--berry);
  font-family: var(--font-data);
  font-size: 9px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

.modal-actions .soft-btn,
.modal-actions .primary-btn {
  width: auto;
  min-width: 90px;
}

.danger-btn {
  border-color: var(--wax);
  background: var(--wax);
  color: var(--wax-ink);
  box-shadow: 0 3px 0 var(--wax-shadow);
}

.danger-btn:hover:not(:disabled) {
  background: var(--wax-light);
}

.danger-btn:active:not(:disabled) {
  box-shadow: 0 1px 0 var(--wax-shadow);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- animations ---------- */
@keyframes breathe {
  0%, 100% { opacity: 0.65; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.1); }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

@keyframes float-up {
  0% { opacity: 0; transform: translate(-50%, 8px) scale(0.9); }
  16% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -76px) scale(1.04); }
}

@keyframes spark-out {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--sx, 0px)), calc(-50% + var(--sy, -40px))) scale(0.2) rotate(120deg); }
}

@keyframes item-pop {
  0% { transform: scale(1); }
  45% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

@keyframes golden-float {
  0%, 100% { transform: translateY(0) rotate(var(--tilt, -4deg)); }
  50% { transform: translateY(-7px) rotate(calc(var(--tilt, -4deg) + 2deg)); }
}

@keyframes rays {
  to { transform: rotate(360deg); }
}

@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@keyframes modal-in {
  from { opacity: 0; transform: translateY(10px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes bell-sway {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(6deg); }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- v3: timing, ink, orders, moon tree ---------- */
.seal-wrap {
  isolation: isolate;
}

.stamp-ring {
  position: absolute;
  inset: -9px;
  z-index: 2;
  border-radius: 50%;
  pointer-events: none;
}

.stamp-ring-good,
.stamp-ring-perfect {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
}

.stamp-ring-good {
  background: conic-gradient(
    from calc(0.5turn - 0.16turn),
    color-mix(in srgb, var(--butter) 62%, transparent) 0 0.32turn,
    transparent 0.32turn
  );
  opacity: 0.58;
}

.stamp-ring-perfect {
  background: conic-gradient(
    from var(--zone-start),
    var(--butter) 0 var(--zone-size),
    transparent var(--zone-size)
  );
  filter: drop-shadow(0 0 5px color-mix(in srgb, var(--butter) 72%, transparent));
}

.stamp-ring-orbit {
  position: absolute;
  inset: 0;
  will-change: transform;
}

.stamp-ring-dot {
  position: absolute;
  top: -4px;
  left: 50%;
  width: 9px;
  height: 9px;
  margin-left: -4.5px;
  border-radius: 50%;
  background: var(--butter);
  border: 1.5px solid var(--paper);
  box-shadow: 0 0 10px color-mix(in srgb, var(--butter) 70%, transparent);
}

.seal-wrap.is-perfect .seal-button {
  filter: brightness(1.06) saturate(1.06);
  box-shadow:
    inset 0 0 0 5px rgba(255, 255, 255, 0.2),
    inset 0 -8px 16px rgba(0, 0, 0, 0.14),
    0 8px 0 var(--wax-shadow),
    0 0 0 4px color-mix(in srgb, var(--butter) 42%, transparent),
    0 14px 26px var(--shadow);
}

.ink-line {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.2;
}

.ink-mark {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
  border-radius: 50% 50% 50% 2px;
  background: var(--ink);
  opacity: 0.72;
  transform: rotate(-45deg);
}

.ink-line strong {
  color: var(--ink);
  font-family: var(--font-data);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.ink-tip {
  margin-left: 6px;
  color: var(--muted);
  font-size: 8.5px;
  white-space: nowrap;
}

.stamp-quality {
  min-height: 12px;
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.35;
  transition: color 160ms ease;
}

.stamp-quality[data-quality="perfect"] {
  color: var(--berry-deep);
  font-weight: 700;
}

.stamp-quality[data-quality="good"] {
  color: var(--moss-deep);
}

.stamp-quality[data-quality="miss"] {
  color: var(--muted);
  opacity: 0.72;
}

/* ---------- orders desk ---------- */
.order-summary {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 13px;
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  background:
    radial-gradient(circle at 92% 12%, color-mix(in srgb, var(--butter) 20%, transparent), transparent 46%),
    var(--paper-2);
}

.order-summary-copy {

}

.order-kicker {

}

.order-summary p {

.order-ink-box {

}

.ink-line-mini {

  align-items: center;

.order-reroll {

.order-reroll:hover:not(:disabled) {

.order-reroll:disabled {

}

}

.order-section {

}

.order-section-head {

.order-title {

}

.order-goal {

}

.order-goal b {

  font-family: var(--font-data);

}

.order-bar {

.order-reward {

.order-note {

.order-timer {

.order-deliver,

.order-empty {

.contract-box {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--paper);
}

.contract-box {
  margin-top: 10px;
}

.tree-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.04em;
}

.tree-head > span:last-child {
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 9px;
  letter-spacing: 0;

.tree-head b {
  color: var(--ink);

.tree-grid {

  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.tree-branch {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 6px;
}

.tree-branch-head {
  padding: 1px 0;
  color: var(--moss-deep);
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-align: center;
}

.tree-node {

  border: 1px solid var(--line);

  background: var(--paper-2);
  color: var(--ink);
  font-family: inherit;

.tree-node:disabled {

}

.tree-node.is-fillable {

.tree-node.is-owned {

.node-dot {

.node-copy b {

.contract-grid {

  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;

  display: flex;
  min-height: 74px;

  border: 1px solid var(--line);

  background: var(--paper-2);
  color: var(--ink);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.contract-card b {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.04em;
}

.contract-card small {
  color: var(--muted);
  font-size: 8px;
  line-height: 1.4;
}

.contract-card > span {
  margin-top: auto;
  color: var(--moss-deep);
  font-size: 8px;
  font-weight: 700;
}

.contract-card.is-active {
  border-color: color-mix(in srgb, var(--butter-deep) 60%, var(--line));
  background: color-mix(in srgb, var(--butter) 16%, var(--paper));
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--butter) 26%, transparent);
}

.contract-card:disabled {
  cursor: default;
  opacity: 0.52;
}

.contract-card.is-active:disabled {
  opacity: 1;
}

/* ---------- event scenes ---------- */
.event-choices {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.event-choice {
  display: flex;
  min-height: 44px;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper-2);
  color: var(--ink);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.event-choice b {
  font-size: 11px;
  font-weight: 700;
}

.event-choice span {
  color: var(--muted);
  font-size: 8.5px;
  line-height: 1.4;
}

.event-choice:hover:not(:disabled) {
  border-color: var(--line-strong);
  background: var(--paper);
}

.event-choice:disabled {
  cursor: default;
  opacity: 0.48;
}

@media (max-width: 620px) {
  .tree-grid,
  .contract-grid {
    grid-template-columns: 1fr;
  }

  .tree-node {
    min-height: 0;
  }

  .order-summary {
    flex-direction: column;
  }

  .order-ink-box {
    width: 100%;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stamp-ring {
    display: none;
  }

  .order-bar span,
  .stamp-quality {
    transition: none;
  }
}


/* ---------- 雾湖远行 ---------- */
.modal-card.is-wide {
  width: min(880px, 100%);
  max-height: min(92vh, 780px);
}

.expedition-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  padding: 11px 12px;
  border: 1px dashed color-mix(in srgb, var(--lavender) 52%, var(--line));
  border-radius: 14px;
  background:
    radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--lavender) 22%, transparent), transparent 50%),
    var(--paper);
}

.expedition-entry.is-locked {
  opacity: 0.62;
}

.expedition-entry > div {
  min-width: 0;
}

.expedition-kicker {
  display: block;
  color: var(--lavender);
  font-family: var(--font-display);
  font-size: 9.5px;
  letter-spacing: 0.1em;
}

.expedition-entry b {
  display: block;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.04em;
}

.expedition-entry p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.5;
}

.expedition-open {
  flex: 0 0 auto;
  min-height: 36px;
  padding: 7px 14px;
  border: 0;
  border-radius: 10px;
  background: color-mix(in srgb, var(--lavender) 56%, var(--ink));
  color: var(--paper);
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 700;
  cursor: pointer;
}

.expedition-open:disabled {
  background: var(--paper-2);
  color: var(--muted);
  cursor: default;
}

.exp-shell {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.exp-head {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}

.exp-stat {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 2px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper-2);
}

.exp-stat small {
  color: var(--muted);
  font-size: 8px;
  letter-spacing: 0.04em;
}

.exp-stat b {
  color: var(--ink);
  font-family: var(--font-data);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.exp-loot b {
  color: var(--moss-deep);
  font-size: 9px;
  white-space: normal;
}

.exp-hearts {
  color: var(--berry-deep);
  font-size: 13px;
  letter-spacing: 0.08em;
}

.exp-progress {
  display: flex;
  align-items: center;
  gap: 5px;
}

.exp-pip {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper-2);
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 9px;
}

.exp-pip.is-current {
  border-color: var(--lavender);
  background: color-mix(in srgb, var(--lavender) 20%, var(--paper));
  color: var(--ink);
  font-weight: 700;
}

.exp-pip.is-done {
  border-color: color-mix(in srgb, var(--moss) 44%, var(--line));
  background: color-mix(in srgb, var(--moss-light) 26%, var(--paper));
  color: var(--moss-deep);
}

.exp-lead {
  margin: 2px 0 7px;
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: 0.04em;
}

.exp-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.exp-option {
  display: flex;
  min-height: 112px;
  flex-direction: column;
  gap: 4px;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background:
    radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--lavender) 14%, transparent), transparent 52%),
    var(--paper-2);
  color: var(--ink);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.exp-option:hover {
  border-color: var(--line-strong);
  background-color: var(--paper);
}

.exp-option b {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.04em;
}

.exp-option p {
  margin: 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.55;
}

.exp-option small {
  margin-top: auto;
  color: var(--moss-deep);
  font-size: 8.5px;
  line-height: 1.45;
}

.exp-tag {
  align-self: flex-start;
  padding: 1px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  color: color-mix(in srgb, var(--lavender) 58%, var(--ink));
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.exp-encounter {
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper-2);
}

.exp-encounter h4 {
  margin: 6px 0 3px;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.04em;
}

.exp-encounter > p {
  margin: 0 0 9px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.6;
}

.exp-hand {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}

.exp-card {
  position: relative;
  display: flex;
  min-height: 86px;
  flex-direction: column;
  gap: 3px;
  padding: 8px 8px 16px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper);
  color: var(--ink);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.exp-card small {
  color: var(--muted);
  font-size: 8px;
  line-height: 1.4;
}

.exp-card b {
  position: absolute;
  right: 7px;
  bottom: 5px;
  color: var(--muted);
  font-family: var(--font-data);
  font-size: 11px;
}

.exp-card.is-match {
  border-color: color-mix(in srgb, var(--butter-deep) 48%, var(--line));
  background: color-mix(in srgb, var(--butter) 12%, var(--paper));
}

.exp-card.is-match b {
  color: var(--butter-deep);
}

.exp-card.is-selected {
  border-color: var(--moss);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--moss) 22%, transparent);
  background: color-mix(in srgb, var(--moss-light) 20%, var(--paper));
}

.exp-card:disabled {
  opacity: 0.44;
  cursor: default;
}

.exp-card-name {
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.04em;
}

.exp-total {
  margin: 9px 0 7px;
  color: var(--muted);
  font-size: 9.5px;
}

.exp-total b {
  color: var(--ink);
  font-family: var(--font-data);
  font-size: 12px;
}

.exp-primary,
.exp-secondary {
  min-height: 38px;
  padding: 8px 16px;
  border: 0;
  border-radius: 10px;
  background: var(--moss-deep);
  color: var(--paper);
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.exp-primary:disabled {
  background: var(--paper-3);
  color: var(--muted);
  cursor: default;
}

.exp-secondary {
  border: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink);
}

.exp-danger {
  background: var(--berry-deep);
}

.exp-hint {
  margin: 7px 0 0 !important;
  color: var(--muted);
  font-size: 8px !important;
  line-height: 1.5 !important;
}

.exp-empty {
  margin: 4px 0 8px !important;
  padding: 9px;
  border: 1px dashed var(--line);
  border-radius: 9px;
  color: var(--muted);
  font-size: 9px !important;
  text-align: center;
}

.exp-choices {
  display: grid;
  gap: 7px;
}

.exp-choice {
  display: flex;
  min-height: 44px;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper);
  color: var(--ink);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.exp-choice b {
  font-size: 10.5px;
}

.exp-choice span {
  color: var(--muted);
  font-size: 8.5px;
}

.exp-choice:disabled {
  opacity: 0.48;
  cursor: default;
}

.exp-log {
  padding: 8px 10px;
  border: 1px dashed var(--line);
  border-radius: 11px;
  background: var(--paper-2);
}

.exp-log > span {
  color: var(--muted);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
}

.exp-log ul {
  margin: 4px 0 0;
  padding: 0;
  list-style: none;
}

.exp-log li {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.55;
}

.exp-log li::before {
  content: "· ";
  color: var(--lavender);
}

.exp-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 2px;
}

.exp-warn {
  color: var(--berry-deep) !important;
  border-bottom-color: color-mix(in srgb, var(--berry-deep) 40%, transparent) !important;
}

.exp-confirm {
  padding: 9px 10px;
  border: 1px solid color-mix(in srgb, var(--berry) 34%, var(--line));
  border-radius: 11px;
  background: color-mix(in srgb, var(--berry) 8%, var(--paper));
}

.exp-confirm p {
  margin: 0 0 6px;
  color: var(--berry-deep);
  font-size: 9.5px;
  line-height: 1.5;
}

.exp-confirm > div {
  display: flex;
  gap: 12px;
}

.exp-result {
  padding: 16px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background:
    radial-gradient(circle at 80% 0%, color-mix(in srgb, var(--butter) 20%, transparent), transparent 50%),
    var(--paper-2);
  text-align: center;
}

.exp-result h4 {
  margin: 7px 0 6px;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.04em;
}

.exp-result p {
  margin: 0 0 5px;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.6;
}

.exp-result-actions {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}

.exp-result .exp-tag {
  align-self: center;
}

@media (max-width: 620px) {
  .modal-card.is-wide {
    width: 100%;
    max-height: 92vh;
    padding: 16px;
  }

  .exp-head {
    grid-template-columns: 1fr 1fr;
  }

  .exp-options {
    grid-template-columns: 1fr;
  }

  .exp-hand {
    grid-template-columns: 1fr 1fr;
  }

  .exp-option {
    min-height: 0;
  }

  .expedition-entry {
    align-items: flex-start;
  }
}

</style>

<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="brand-seal" aria-hidden="true">
        <span class="s-icon" style="--r:5;--c:0"></span>
      </div>
      <div>
        <h1>苔藓邮局</h1>
        <p>把想说的话，交给苔藓和月亮。</p>
      </div>
    </div>

    <div class="topbar-right">
      <div class="day-note">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="dayLabel">今天 · 宜寄一封慢信</span>
      </div>
      <button class="soft-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="关闭音效">
        <span class="s-icon" id="soundIconOn" style="--r:5;--c:2" aria-hidden="true"></span>
        <span class="s-icon" id="soundIconOff" style="--r:5;--c:3" aria-hidden="true" hidden></span>
        <span id="soundLabel">音效 开</span>
      </button>
    </div>
  </header>

  <main class="game-grid">
    <section class="stage-card" id="stageCard" aria-label="苔藓邮局寄信窗口">
      <div class="stage-head">
        <span class="eyebrow">第一窗口 · 盖戳寄信</span>
        <span class="open-pill">营业中</span>
      </div>

      <div class="scene" id="scene" data-weather="sunny">
        <img class="scene-bg" id="sceneBg" src="assets/scene-dusk.webp" width="1536" height="1024" alt="" fetchpriority="high" decoding="async" draggable="false">

        <div class="scene-fx" id="sceneFx" aria-hidden="true"></div>
        <div class="scene-grain" aria-hidden="true"></div>

        <div class="weather-chip" id="weatherChip" title="苔藓镇的天气会给不同邮差带来加成">
          <span class="weather-icon" id="weatherIcon" aria-hidden="true">
            <span class="s-icon" style="--r:3;--c:3"></span>
          </span>
          <span id="weatherLabel">晴天 · 盖戳 +80%</span>
        </div>

        <button class="golden-letter" id="goldenLetter" type="button" aria-label="拆开一封闪光的信" hidden>
          <span class="golden-rays" aria-hidden="true"></span>
          <span class="s-icon" style="--r:5;--c:0" aria-hidden="true"></span>
          <span class="golden-tag">闪光的信</span>
        </button>
        <div class="scene-sparks" id="sceneSparks" aria-hidden="true"></div>
      </div>

      <div class="counter">
        <div class="ledger">
          <span class="ledger-label">存票夹</span>
          <div class="amount-row">
            <span class="stamp-mark" aria-hidden="true"></span>
            <strong class="big-amount" id="stampCount">0</strong>
            <span class="amount-unit">张邮票</span>
          </div>
          <div class="rate-line">
            <span>自动送信</span>
            <strong id="rateText">+0/秒</strong>
            <span class="rate-sep">·</span>
            <span>每戳 <b id="clickValue">+1</b></span>
          </div>
          <div class="combo-line" aria-hidden="true">
            <span class="combo-label" id="comboLabel">连击 ×1.00</span>
            <span class="combo-track"><span class="combo-fill" id="comboFill"></span></span>
            <span class="combo-tip" id="comboTip">金圈内盖戳 ×3</span>
          </div>
          <div class="ink-line">
            <span class="ink-mark" aria-hidden="true"></span>
            <span class="ink-label">墨点</span>
            <strong id="inkCount">0</strong>
            <span class="ink-tip" id="inkTip">完美盖戳 +1</span>
          </div>
          <p class="stamp-quality" id="stampQuality" aria-live="polite">等蜡封转到金圈时盖戳，完美 ×3</p>
        </div>

        <div class="seal-wrap">
          <div class="stamp-ring" id="stampRing" aria-hidden="true">
            <span class="stamp-ring-good"></span>
            <span class="stamp-ring-perfect"></span>
            <span class="stamp-ring-orbit" id="stampOrbit"><span class="stamp-ring-dot"></span></span>
          </div>
          <button class="seal-button" id="stampBtn" type="button" aria-label="盖戳寄信，获得 1 张邮票">
            <span class="s-icon" style="--r:1;--c:2" aria-hidden="true"></span>
            <span class="seal-title">盖戳</span>
            <span class="seal-gain" id="sealGain">+1</span>
          </button>
          <div class="floaters" id="floaters" aria-hidden="true"></div>
        </div>
      </div>

      <div class="goal-strip" id="goalStrip">
        <div class="goal-mark" aria-hidden="true">愿</div>
        <div class="goal-body">
          <div class="goal-top">
            <span>今日小愿望</span>
            <span class="goal-count" id="goalCount">0 / 13</span>
          </div>
          <p class="goal-title" id="goalTitle">盖下第一枚邮戳</p>
          <div class="goal-bar"><span class="goal-fill" id="goalFill"></span></div>
        </div>
        <button class="bell-btn" id="bellBtn" type="button" aria-label="摇响风铃，20 秒内让全邮局产出变为 3 倍">
          <span class="bell-inner">
            <span class="s-icon" style="--r:2;--c:1" aria-hidden="true"></span>
            <span class="bell-label" id="bellLabel">摇铃</span>
            <span class="bell-sub" id="bellSub">就绪</span>
          </span>
        </button>
      </div>
    </section>

    <aside class="shop-card" aria-label="邮局小店">
      <div class="shop-head">
        <div>
          <span class="eyebrow" id="panelEyebrow">苔藓镇 · 邮局小店</span>
          <h2 id="panelTitle">把信交给谁？</h2>
        </div>
        <div class="buy-switch" id="buySwitch" role="group" aria-label="购买数量">
          <button type="button" data-amount="1" aria-pressed="true">买 1</button>
          <button type="button" data-amount="10" aria-pressed="false">买 10</button>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="邮局小店分类">
        <button class="tab" id="tabPosties" type="button" role="tab" aria-selected="true" aria-controls="panelBody" data-tab="posties">邮差</button>
        <button class="tab" id="tabOrders" type="button" role="tab" aria-selected="false" aria-controls="panelBody" data-tab="orders" tabindex="-1">信件 <span class="tab-count" id="orderDot" hidden>0</span></button>
        <button class="tab" id="tabDispatch" type="button" role="tab" aria-selected="false" aria-controls="panelBody" data-tab="dispatch" tabindex="-1">邮路 <span class="tab-count" id="dispatchDot" hidden>0</span></button>
        <button class="tab" id="tabUpgrades" type="button" role="tab" aria-selected="false" aria-controls="panelBody" data-tab="upgrades" tabindex="-1">工坊 <span class="tab-count" id="upgradeDot" hidden>0</span></button>
        <button class="tab" id="tabAlbum" type="button" role="tab" aria-selected="false" aria-controls="panelBody" data-tab="album" tabindex="-1">邮册 <span class="tab-count" id="albumDot" hidden>0</span></button>
        <button class="tab" id="tabMoon" type="button" role="tab" aria-selected="false" aria-controls="panelBody" data-tab="moon" tabindex="-1">月亮 <span class="tab-count" id="moonDot" hidden>!</span></button>
      </div>

      <div class="panel" id="panelBody" role="tabpanel" aria-labelledby="tabPosties"></div>

      <div class="shop-foot">
        <span id="collectionText">邮戳收藏 0 / 7</span>
        <button class="link-btn" id="helpBtn" type="button">怎么玩</button>
      </div>
    </aside>
  </main>

  <footer class="page-foot">
    <p><span class="foot-dot" aria-hidden="true"></span>离开时也会慢慢送信，收益按一半计算，最多两小时。</p>
    <div class="foot-actions">
      <span id="saveNote">会自动夹进邮册</span>
      <button class="link-btn" id="resetBtn" type="button">重新开张</button>
    </div>
  </footer>
</div>

<div class="mobile-dock" id="mobileDock" role="region" aria-label="快捷窗口">
  <div class="mobile-dock-inner">
    <div class="quick-stats">
      <span class="quick-label">存票夹</span>
      <strong id="quickStamps">0</strong>
      <span id="quickRate">+0/秒</span>
    </div>
    <button class="quick-shop" id="quickShopBtn" type="button" aria-label="跳到邮局小店">
      <span class="s-icon" style="--r:5;--c:1" aria-hidden="true"></span>
      <span>小店</span>
    </button>
    <button class="quick-seal" id="quickStampBtn" type="button" aria-label="盖戳寄信，获得 1 张邮票">
      <span>盖戳</span>
      <b id="quickGain">+1</b>
    </button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody" tabindex="-1">
    <div class="modal-kicker">苔藓邮局 · 通知</div>
    <h3 id="modalTitle">通知</h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="soft-btn" id="modalCancel" type="button">再想想</button>
      <button class="primary-btn" id="modalConfirm" type="button">确定</button>
    </div>
  </div>
</div>

<script src="assets/pixi-7.4.2.min.js"></script>
<script src="assets/pixi-unsafe-eval-7.4.2.min.js"></script>
<script src="game.js"></script>
</body>
</html>
